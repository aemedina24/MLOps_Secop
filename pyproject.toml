[project]
name = "mlops-secop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aemedina24", email = "aemedina@unal.edu.co" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "dvc[gdrive]>=3.67.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyopenssl>=24",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
