name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Sincronizar dependencias (uv sync)
        run: uv sync --all-extras --dev

      - name: Lint con Ruff
        run: uv run ruff check .

      - name: Verificar formato con Ruff
        run: uv run ruff format --check .

      - name: Ejecutar tests (pytest)
        run: uv run pytest
